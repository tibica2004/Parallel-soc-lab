# SOC pasul 12b — ModSecurity ca SENZOR. Incarcat din /etc/modsecurity/*.conf, INAINTE de CRS.
# DetectionOnly: nicio cerere nu e blocata; avertismentele merg in error.log-ul Apache
# (colectat deja in logs-apache.error) -> regula Kibana soc-modsec-anomaly.
# Trecerea la "SecRuleEngine On" e o actiune activa: readiness + decizie umana (ca pasul 9).
SecRuleEngine DetectionOnly
# Fara jurnal de audit cu corpul cererilor: site-ul n-are HTTPS, corpurile de login au parole.
SecAuditEngine Off

# Paranoia 1 (minimul CRS, cele mai putine fals pozitive pe WordPress).
SecAction "id:900000,phase:1,nolog,pass,t:none,setvar:tx.paranoia_level=1"
# Pragul de anomalie: mesajul "Inbound Anomaly Score Exceeded" apare doar de la 20 in sus
# (pragul "high" din task); scorul exact il extrage codul (sensor_rules.modsec_facts).
SecAction "id:900110,phase:1,nolog,pass,t:none,setvar:tx.inbound_anomaly_score_threshold=20,setvar:tx.outbound_anomaly_score_threshold=20"
