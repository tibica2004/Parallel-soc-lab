# SOC pasul 10 (igiena): HTTPS pe web-prod, ca parola de login WordPress sa nu mai circule in clar
# (Suricata: "ET INFO Cleartext WordPress Login"). HTTP ramane: harness-ul si atacatorul de
# laborator il folosesc. Fara FORCE_SSL_ADMIN: pagina de login ceruta prin HTTPS trimite
# formularul tot prin HTTPS (WordPress alege schema dupa cererea curenta), deci benign-gen
# intra prin https:// iar restul traficului nu se schimba. Aceleasi jurnale ca vhost-ul :80
# (colectate deja de integrarea Apache).
<IfModule mod_ssl.c>
<VirtualHost *:443>
	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/html
	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined
	SSLEngine on
	SSLCertificateFile /etc/ssl/soc/web-prod.crt
	SSLCertificateKeyFile /etc/ssl/soc/web-prod.key
	SSLProtocol -all +TLSv1.2 +TLSv1.3
	SSLHonorCipherOrder off
	SSLSessionTickets off
</VirtualHost>
</IfModule>
