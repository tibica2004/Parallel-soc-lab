# AIDE pentru SOC (pasul 3.E, G9). Configuratie proprie, separata de /etc/aide/aide.conf
# al distributiei (aide-common nu se instaleaza: fara timerul lui zilnic pe tot discul).
# Rulat doar de /usr/local/sbin/soc-aide-check.

database_in=file:/var/lib/soc-aide/aide.db.gz
database_out=file:/var/lib/soc-aide/aide.db.new.gz
gzip_dbout=yes
report_url=stdout
report_format=plain

# Continut + metadate (fara atime: citirea nu e o schimbare).
SOC = p+i+n+u+g+s+m+c+sha256

/etc SOC
/usr/bin SOC
/usr/sbin SOC
/usr/local/bin SOC
/usr/local/sbin SOC
/var/www/html SOC

# Volatile, schimbate legitim la fiecare boot/cerere.
!/etc/mtab$
!/etc/adjtime$
!/var/www/html/wp-content/uploads
!/var/www/html/wp-content/cache
!/var/www/html/wp-content/upgrade

# Momelile NU se citesc (altfel auditd -> honeytoken in fiecare noapte). Modificarea lor o
# vede Defend (soc-honeytoken-host). wp-config.php SE citeste: regula soc-honey-wpconfig-read
# exclude /usr/bin/aide.
!/var/www/html/\.env\.bak$
!/var/www/html/backup\.sql$
