# SOC hardening Apache (pas 0.5). Drop-in in conf-available, activat cu a2enconf.
# Se incarca dupa security.conf (conf-enabled e inclus in ordine alfabetica:
# "security" < "soc-hardening"), deci ServerTokens/ServerSignature de aici
# suprascriu valorile din security.conf.
#
# Rollback complet (nu atinge niciun fisier al distributiei):
#   sudo a2disconf soc-hardening && sudo systemctl reload apache2
#   sudo rm /etc/apache2/conf-available/soc-hardening.conf

# Ascunde versiunea si OS-ul din antetul Server si din paginile de eroare.
# "Server: Apache/2.4.58 (Ubuntu)" -> "Server: Apache".
ServerTokens Prod
ServerSignature Off

# TRACE dezactivat (deja Off in security.conf; explicit aici pentru claritate).
TraceEnable Off

# Suprima avertismentul AH00558 si fixeaza numele canonic. ATENTIE: NU setam
# UseCanonicalName On -- ramane Off (implicit), ca Apache sa foloseasca antetul Host
# pentru redirectari. Altfel accesul prin IP-ul flotant (172.30.6.249) s-ar rupe,
# pentru ca redirectarile ar trimite spre 192.168.10.138 (intern, inaccesibil extern).
ServerName 192.168.10.138

# xmlrpc.php nu are clienti legitimi (0 hituri in access.log) si e o suprafata clasica
# de brute-force amplificat / pingback DDoS. Blocat la nivel Apache (403).
# Daca vreodata un plugin legitim il cere (Jetpack, aplicatia mobila WP), sterge blocul.
<Files "xmlrpc.php">
    Require all denied
</Files>
