- name: Persistenta — cron job adaugat
  path: hunt
  ground_truth: attack
  generate: (crontab -l 2>/dev/null; echo "* * * * * /tmp/.beacon") | crontab - ;
    crontab -r
  finding:
    host: web-prod
    kind: new_parent_child
    detail:
      parent: bash
      child: crontab
    rarity_score: 0.9
- name: Reverse shell in Python
  path: hunt
  ground_truth: attack
  generate: timeout 2 python3 -c "import socket,os; s=socket.socket(); s.connect((\"127.0.0.1\",9998))"
    2>/dev/null; echo done
  finding:
    host: web-prod
    kind: new_parent_child
    detail:
      parent: timeout
      child: python3.13
    rarity_score: 1.0
